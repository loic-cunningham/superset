name: Launch Devin on PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number for Devin to work on"
        required: true
        type: number
      instructions:
        description: "Custom instructions for Devin"
        required: true
        type: string

jobs:
  launch-devin:
    name: Launch Devin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Prepare Devin prompt
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CUSTOM_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');

            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
              core.setFailed(`@${context.actor} does not have permission to launch Devin for this repository.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}; choose an open PR.`);
              return;
            }

            const instructions = process.env.CUSTOM_INSTRUCTIONS.trim();
            if (!instructions) {
              core.setFailed('Custom instructions are required.');
              return;
            }

            const prompt = [
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Pull request: #${pr.number} - ${pr.title}`,
              `Pull request URL: ${pr.html_url}`,
              `Base branch: ${pr.base.ref}`,
              `Head branch: ${pr.head.ref}`,
              `Head repository: ${pr.head.repo.full_name}`,
              `Head SHA: ${pr.head.sha}`,
              `Triggered by: @${context.actor}`,
              '',
              'Work directly on this open PR. Review the PR diff and context, follow the custom instructions below, push any necessary commits to the PR branch if permitted, and comment on the PR with a concise summary when finished.',
              '',
              'Custom instructions:',
              instructions,
            ].join('\n');

            const requestBody = {
              prompt,
              title: `PR #${pr.number}: ${pr.title}`.slice(0, 80),
              repos: [`${context.repo.owner}/${context.repo.repo}`],
              tags: [
                'github-actions',
                'manual-pr',
                `repo-${context.repo.owner}-${context.repo.repo}`,
                `pr-${pr.number}`,
              ],
            };

            fs.writeFileSync('devin-request.json', JSON.stringify(requestBody, null, 2));

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_title', pr.title);

      - name: Create Devin session
        id: devin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        with:
          script: |
            const fs = require('fs');

            const apiKey = process.env.DEVIN_API_KEY;
            const orgId = process.env.DEVIN_ORG_ID;

            if (!apiKey || !orgId) {
              core.setFailed('DEVIN_API_KEY and DEVIN_ORG_ID repository secrets are required.');
              return;
            }

            const response = await fetch(`https://api.devin.ai/v3/organizations/${encodeURIComponent(orgId)}/sessions`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
              },
              body: fs.readFileSync('devin-request.json', 'utf8'),
            });

            const responseText = await response.text();
            let responseBody;
            try {
              responseBody = JSON.parse(responseText);
            } catch {
              responseBody = { raw_response: responseText };
            }

            if (!response.ok) {
              core.setFailed(`Devin API request failed with ${response.status}: ${responseText}`);
              return;
            }

            fs.writeFileSync('devin-response.json', JSON.stringify(responseBody, null, 2));

            const sessionId = responseBody.session_id || '';
            const sessionUrl = responseBody.url || (sessionId ? `https://app.devin.ai/sessions/${sessionId}` : '');

            core.setOutput('session_id', sessionId);
            core.setOutput('session_url', sessionUrl);
            await core.summary
              .addHeading('Devin session launched')
              .addLink(sessionUrl || sessionId, sessionUrl || `https://app.devin.ai/sessions/${sessionId}`)
              .write();

      - name: Comment on PR
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SESSION_ID: ${{ steps.devin.outputs.session_id }}
          SESSION_URL: ${{ steps.devin.outputs.session_url }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sessionLink = process.env.SESSION_URL || `https://app.devin.ai/sessions/${process.env.SESSION_ID}`;
            const body = [
              `Devin was launched by @${context.actor} for this PR.`,
              '',
              `Session: ${sessionLink}`,
              `Workflow run: ${process.env.RUN_URL}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
