name: Devin Mutation Testing

on:
  pull_request:
    types: [opened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run mutation testing on"
        required: true
        type: number

jobs:
  launch-devin:
    name: Launch Devin Mutation Testing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .devin/docs/

      - name: Resolve PR number
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Devin prompt
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');

            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}; choose an open PR.`);
              return;
            }

            // Read the mutation testing instructions and all 3 templates
            const docsDir = '.devin/docs';
            const instructionFiles = [
              'mutation_testing_agent_handoff.md',
              'template_01_test_foundation.md',
              'template_02_mutation_testing.md',
              'template_03_final_report.md',
            ];

            const instructions = [];
            for (const file of instructionFiles) {
              const filePath = `${docsDir}/${file}`;
              if (!fs.existsSync(filePath)) {
                core.setFailed(`Required instruction file not found: ${filePath}`);
                return;
              }
              const content = fs.readFileSync(filePath, 'utf8');
              instructions.push(`--- BEGIN ${file} ---\n${content}\n--- END ${file} ---`);
            }

            const prompt = [
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Pull request: #${pr.number} - ${pr.title}`,
              `Pull request URL: ${pr.html_url}`,
              `Base branch: ${pr.base.ref}`,
              `Head branch: ${pr.head.ref}`,
              `Head repository: ${pr.head.repo.full_name}`,
              `Head SHA: ${pr.head.sha}`,
              '',
              'You are running the mutation testing workflow on this PR. Follow the instructions below end-to-end.',
              'Work directly on this open PR. Check out the PR branch, follow the full lifecycle (triage → [foundation] → measure → log → improve → verify → commit → report), push commits to the PR branch, and post the final PR comment.',
              '',
              'CRITICAL: All outputs (foundation test plan, mutation testing log, PR comments) MUST follow the corresponding templates EXACTLY. These are the ONLY valid formats. Do not create custom formats.',
              '',
              ...instructions,
            ].join('\n');

            const requestBody = {
              prompt,
              title: `Mutation Testing: PR #${pr.number} — ${pr.title}`.slice(0, 80),
              repos: [`${context.repo.owner}/${context.repo.repo}`],
              tags: [
                'github-actions',
                'mutation-testing',
                `repo-${context.repo.owner}-${context.repo.repo}`,
                `pr-${pr.number}`,
              ],
            };

            fs.writeFileSync('devin-request.json', JSON.stringify(requestBody, null, 2));

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_title', pr.title);

      - name: Create Devin session
        id: devin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        with:
          script: |
            const fs = require('fs');

            const apiKey = process.env.DEVIN_API_KEY;
            const orgId = process.env.DEVIN_ORG_ID;

            if (!apiKey || !orgId) {
              core.setFailed('DEVIN_API_KEY and DEVIN_ORG_ID repository secrets are required.');
              return;
            }

            const response = await fetch(`https://api.devin.ai/v3/organizations/${encodeURIComponent(orgId)}/sessions`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
              },
              body: fs.readFileSync('devin-request.json', 'utf8'),
            });

            const responseText = await response.text();
            let responseBody;
            try {
              responseBody = JSON.parse(responseText);
            } catch {
              responseBody = { raw_response: responseText };
            }

            if (!response.ok) {
              core.setFailed(`Devin API request failed with ${response.status}: ${responseText}`);
              return;
            }

            fs.writeFileSync('devin-response.json', JSON.stringify(responseBody, null, 2));

            const sessionId = responseBody.session_id || '';
            const sessionUrl = responseBody.url || (sessionId ? `https://app.devin.ai/sessions/${sessionId}` : '');

            core.setOutput('session_id', sessionId);
            core.setOutput('session_url', sessionUrl);
            await core.summary
              .addHeading('Devin Mutation Testing session launched')
              .addLink(sessionUrl || sessionId, sessionUrl || `https://app.devin.ai/sessions/${sessionId}`)
              .write();

      - name: Comment on PR
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SESSION_ID: ${{ steps.devin.outputs.session_id }}
          SESSION_URL: ${{ steps.devin.outputs.session_url }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sessionLink = process.env.SESSION_URL || `https://app.devin.ai/sessions/${process.env.SESSION_ID}`;
            const body = [
              '🧬 **Devin Mutation Testing** was launched for this PR.',
              '',
              `Session: ${sessionLink}`,
              `Workflow run: ${process.env.RUN_URL}`,
              '',
              'Devin will:',
              '1. Assess existing test coverage (triage)',
              '2. Create foundation tests if needed',
              '3. Run targeted mutation testing',
              '4. Fix surviving mutation gaps and coverage holes',
              '5. Post a detailed before/after report on this PR',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
