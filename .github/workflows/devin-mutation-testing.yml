name: Devin Mutation Testing

on:
  pull_request:
    types: [opened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run mutation testing on"
        required: true
        type: number

jobs:
  launch-devin:
    name: Launch Devin Mutation Testing
    runs-on: ubuntu-24.04
    # Guard against unexpected hangs; the Devin API call has its own timeout.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout mutation-testing templates from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'master' }}
          sparse-checkout: |
            .devin/mutation-testing/templates/

      - name: Resolve PR number
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Override PR-changed templates
        run: |
          pr_number="${{ steps.resolve.outputs.pr_number }}"
          git fetch origin "pull/${pr_number}/head" --depth=1
          changed=$(git diff --name-only HEAD FETCH_HEAD -- .devin/mutation-testing/templates/)
          if [ -n "$changed" ]; then
            echo "PR #${pr_number} modifies these template files — using PR versions:"
            echo "$changed"
            echo "$changed" | while IFS= read -r f; do
              mkdir -p "$(dirname "${f}")"
              git show "FETCH_HEAD:${f}" > "${f}"
            done
          else
            echo "No .devin/mutation-testing/templates/ changes in PR #${pr_number} — using default branch versions."
          fi

      - name: Prepare Devin prompt
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');

            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}; choose an open PR.`);
              return;
            }

            // Read the mutation testing instructions and all 3 templates
            const docsDir = '.devin/mutation-testing/templates';
            const instructionFiles = [
              'mutation_testing_agent_handoff.md',
              'template_01_test_foundation.md',
              'template_02_mutation_testing.md',
              'template_03_final_report.md',
            ];

            const instructions = [];
            for (const file of instructionFiles) {
              const filePath = `${docsDir}/${file}`;
              if (!fs.existsSync(filePath)) {
                core.setFailed(`Required instruction file not found: ${filePath}`);
                return;
              }
              const content = fs.readFileSync(filePath, 'utf8');
              instructions.push(`--- BEGIN ${file} ---\n${content}\n--- END ${file} ---`);
            }

            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const prompt = [
              `Repository: ${repoFullName}`,
              `Pull request: #${pr.number} - ${pr.title}`,
              `Pull request URL: ${pr.html_url}`,
              `Base branch: ${pr.base.ref}`,
              `Head branch: ${pr.head.ref}`,
              `Head repository: ${pr.head.repo.full_name}`,
              `Head SHA: ${pr.head.sha}`,
              '',
              'You are running the mutation testing workflow on this PR. The Devin GitHub integration is already authenticated for this repo, so plain git commands work without any extra setup. Check out the PR branch with:',
              '```',
              `git fetch origin pull/${pr.number}/head:${pr.head.ref}`,
              `git checkout ${pr.head.ref}`,
              '```',
              '',
              'Do NOT run `gh auth login`, `gh auth setup-git`, `gh pr checkout`, `git remote set-url`, or `export GH_TOKEN=...`. Those override the proxy credential helper and break git auth in this environment. Push commits with `git push origin <branch>` and post PR comments with the built-in `git_comment` tool.',
              '',
              'Follow the full lifecycle (triage → [foundation] → measure → log → improve → verify → commit → report), push commits to the PR branch, and post the final PR comment.',
              '',
              'CRITICAL: All outputs (foundation test plan, mutation testing log, PR comments) MUST follow the corresponding templates EXACTLY. These are the ONLY valid formats. Do not create custom formats.',
              '',
              ...instructions,
            ].join('\n');

            const requestBody = {
              prompt,
              title: `Mutation Testing: PR #${pr.number} — ${pr.title}`.slice(0, 80),
              repos: [repoFullName],
              tags: [
                'github-actions',
                'mutation-testing',
                `repo-${context.repo.owner}-${context.repo.repo}`,
                `pr-${pr.number}`,
              ],
            };

            fs.writeFileSync('devin-request.json', JSON.stringify(requestBody, null, 2));

      - name: Create Devin session
        id: devin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        with:
          script: |
            const fs = require('fs');
            const apiKey = process.env.DEVIN_API_KEY;
            const orgId = process.env.DEVIN_ORG_ID;
            if (!apiKey || !orgId) {
              core.setFailed('DEVIN_API_KEY and DEVIN_ORG_ID repository secrets are required.');
              return;
            }
            // Explicit timeout so a slow API response does not hang the step.
            const DEVIN_API_TIMEOUT_MS = 60_000;
            let response;
            try {
              response = await fetch(`https://api.devin.ai/v3/organizations/${encodeURIComponent(orgId)}/sessions`, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                },
                body: fs.readFileSync('devin-request.json', 'utf8'),
                signal: AbortSignal.timeout(DEVIN_API_TIMEOUT_MS),
              });
            } catch (err) {
              if (err && (err.name === 'TimeoutError' || err.name === 'AbortError')) {
                core.setFailed(`Devin API request timed out after ${DEVIN_API_TIMEOUT_MS / 1000}s`);
                return;
              }
              core.setFailed(`Devin API request failed: ${err && err.message ? err.message : err}`);
              return;
            }
            const responseText = await response.text();
            let responseBody;
            try { responseBody = JSON.parse(responseText); } catch { responseBody = { raw_response: responseText }; }
            if (!response.ok) {
              core.setFailed(`Devin API request failed with ${response.status}: ${responseText}`);
              return;
            }
            fs.writeFileSync('devin-response.json', JSON.stringify(responseBody, null, 2));
            const sessionId = responseBody.session_id || '';
            const sessionUrl = responseBody.url || (sessionId ? `https://app.devin.ai/sessions/${sessionId}` : '');
            core.setOutput('session_id', sessionId);
            core.setOutput('session_url', sessionUrl);
            await core.summary
              .addHeading('Devin Mutation Testing session launched')
              .addLink(sessionUrl || sessionId, sessionUrl || `https://app.devin.ai/sessions/${sessionId}`)
              .write();


